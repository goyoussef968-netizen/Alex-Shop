
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة أليكس شوب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',system-ui,sans-serif}
body{background:#f3f4f6;color:#1a1a1a}
header{background:#1f2937;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}
header .wrap{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{font-weight:800;font-size:1.2rem}
.logo small{display:block;font-size:.7rem;font-weight:400;opacity:.8}
.tabs{display:flex;gap:6px}
.tabs button{background:#374151;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.88rem}
.tabs button.on{background:#16a34a}
main{max-width:900px;margin:0 auto;padding:16px}
.panel{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:14px}
.order{border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.order .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.order .id{font-weight:800;color:#15803d}
.order .meta{font-size:.8rem;color:#666;margin-top:4px}
.order .items{font-size:.85rem;margin-top:8px;background:#f9fafb;border-radius:8px;padding:8px 10px}
.order .tot{font-weight:800;margin-top:6px}
select.st{padding:6px 10px;border-radius:8px;border:1.5px solid #d1d5db;font-weight:700;font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid #eee}
th{background:#f9fafb;font-size:.8rem;color:#555}
.btn{background:#16a34a;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.85rem}
.btn.gray{background:#6b7280}.btn.red{background:#dc2626}.btn.sm{padding:4px 10px;font-size:.78rem}
input,select{width:100%;padding:9px 11px;border:1.5px solid #d1d5db;border-radius:9px;font-size:.95rem;background:#fff}
label{display:block;font-weight:700;font-size:.82rem;margin:10px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.note{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:10px 14px;font-size:.8rem;margin-bottom:14px}
.empty{text-align:center;color:#999;padding:30px 0}
.gate{max-width:360px;margin:60px auto;background:#fff;border-radius:16px;padding:28px 22px;box-shadow:0 2px 12px rgba(0,0,0,.1);text-align:center}
.gate h2{margin-bottom:6px}
.gate p{font-size:.85rem;color:#666;margin-bottom:8px}
.gate .warn{font-size:.72rem;color:#b45309;margin-top:10px}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700;font-size:.88rem;color:#15803d}
</style>
</head>
<body>
<div class="gate" id="gate">
 <h2>🔐 لوحة الإدارة</h2>
 <p>أليكس شوب — Alex Shop</p>
 <input type="password" id="pin" placeholder="كلمة السر" style="text-align:center">
 <button class="btn" style="width:100%;margin-top:10px" onclick="login()">دخول</button>
 <div class="warn">⚠️ كلمة السر الافتراضية admin123 — غيّرها من الكود قبل النشر. دي حماية بسيطة للنسخة التجريبية مش أمان حقيقي.</div>
</div>
<div id="panel" style="display:none">
<header><div class="wrap">
 <div class="logo">🛠 لوحة إدارة أليكس شوب<small>المتاجر · المنتجات · الطلبات</small></div>
 <div class="tabs">
  <button id="tOrders" class="on" onclick="tab('orders')">الطلبات</button>
  <button id="tStores" onclick="tab('stores')">المتاجر والمنتجات</button>
 </div>
</div></header>
<main id="app"></main>
</div>
<script>
const K_STORES='alexshop_stores_v1', K_ORDERS='alexshop_orders_v1';
const ADMIN_PIN='admin123'; // غيّر كلمة السر من هنا قبل النشر
const DEFAULT_STORES=[
 {id:'s1',name:'سوبر ماركت النور',cat:'بقالة وسوبر ماركت',icon:'🏪',time:'30-45 دقيقة',min:50,products:[
  {id:'p1',name:'أرز مصري فاخر',unit:'كيلو',price:38},{id:'p2',name:'سكر',unit:'كيلو',price:32},
  {id:'p3',name:'زيت عباد الشمس',unit:'700 مل',price:75},{id:'p4',name:'مكرونة',unit:'400 جم',price:14},
  {id:'p5',name:'شاي ليبتون',unit:'100 فتلة',price:85},{id:'p6',name:'جبنة رومي',unit:'كيلو',price:280}]},
 {id:'s2',name:'خضار وفاكهة الحاج سيد',cat:'خضار وفاكهة',icon:'🥬',time:'25-40 دقيقة',min:30,products:[
  {id:'p1',name:'طماطم',unit:'كيلو',price:18},{id:'p2',name:'بطاطس',unit:'كيلو',price:16},
  {id:'p3',name:'بصل',unit:'كيلو',price:20},{id:'p4',name:'موز',unit:'كيلو',price:35},
  {id:'p5',name:'برتقال',unit:'كيلو',price:22},{id:'p6',name:'خيار',unit:'كيلو',price:20}]},
 {id:'s3',name:'مخبز العائلة',cat:'مخبوزات',icon:'🥐',time:'20-30 دقيقة',min:20,products:[
  {id:'p1',name:'عيش بلدي',unit:'5 أرغفة',price:15},{id:'p2',name:'عيش فينو',unit:'5 أرغفة',price:20},
  {id:'p3',name:'كرواسون بالشوكولاتة',unit:'قطعة',price:18},{id:'p4',name:'باتيه باللحمة',unit:'قطعة',price:22},
  {id:'p5',name:'قطر الشام',unit:'كيلو',price:90}]},
 {id:'s4',name:'بن البرازيلي',cat:'قهوة ومحمصة',icon:'☕',time:'35-50 دقيقة',min:40,products:[
  {id:'p1',name:'بن تركي سادة',unit:'ربع كيلو',price:95},{id:'p2',name:'بن فرنساوي',unit:'ربع كيلو',price:105},
  {id:'p3',name:'مكسرات مشكلة',unit:'ربع كيلو',price:120},{id:'p4',name:'لب سوري',unit:'ربع كيلو',price:65}]}
];
function getStores(){try{const s=localStorage.getItem(K_STORES);if(s)return JSON.parse(s)}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_STORES))}
function saveStores(s){localStorage.setItem(K_STORES,JSON.stringify(s))}
function getOrders(){try{return JSON.parse(localStorage.getItem(K_ORDERS))||[]}catch(e){return[]}}
function saveOrders(o){localStorage.setItem(K_ORDERS,JSON.stringify(o))}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function login(){
 if(document.getElementById('pin').value===ADMIN_PIN){
  document.getElementById('gate').style.display='none';
  document.getElementById('panel').style.display='block';render();
 }else alert('كلمة السر غلط');
}
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
let cur='orders', selStore=null;
function tab(t){cur=t;document.getElementById('tOrders').className=t==='orders'?'on':'';document.getElementById('tStores').className=t==='stores'?'on':'';render()}
const STATUSES=['جديد','مقبول','خرج للتوصيل','اتسلّم','ملغي'];
const app=document.getElementById('app');
function render(){cur==='orders'?renderOrders():renderStores()}
function renderOrders(){
 const orders=getOrders();
 app.innerHTML=`<div class="panel"><h2 style="margin-bottom:10px">📦 الطلبات (${orders.length})</h2>
 <div class="note">الطلبات بتتسجل في متصفح العميل على نفس الدومين (نسخة تجريبية بدون سيرفر). عشان تشوف طلبات العملاء الحقيقيين محتاج قاعدة بيانات — دي مرحلة لاحقة.</div>
 ${orders.length?orders.map((o,i)=>`
 <div class="order">
  <div class="top"><span class="id">${esc(o.id)}</span>
   <select class="st" onchange="setStatus(${i},this.value)">
   ${STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>
  <div class="meta">👤 ${esc(o.name)} · 📞 ${esc(o.phone)} · 💳 ${esc(o.payment)}</div>
  <div class="meta">📍 ${esc(o.address)}</div>
  <div class="meta">🕐 ${new Date(o.createdAt).toLocaleString('ar-EG')}</div>
  <div class="items">${o.items.map(x=>`${esc(x.name)} × ${x.qty} (${x.price*x.qty} ج) — ${esc(x.store)}`).join('<br>')}</div>
  <div class="tot">الإجمالي: ${o.total} ج (شامل توصيل ${o.fee} ج)</div>
 </div>`).join(''):'<div class="empty">مفيش طلبات لسه.<br>جرّب اعمل طلب من صفحة العميل (index.html) على نفس المتصفح وهيظهر هنا.</div>'}
 </div>`;
}
function setStatus(i,v){const o=getOrders();o[i].status=v;saveOrders(o)}
function renderStores(){
 const stores=getStores();
 app.innerHTML=`
 <div class="panel">
 <h2 style="margin-bottom:10px">🏪 المتاجر (${stores.length})</h2>
 <table><tr><th>المتجر</th><th>القسم</th><th>وقت التوصيل</th><th>حد أدنى</th><th></th></tr>
 ${stores.map(s=>`<tr>
  <td><b>${s.icon||'🏪'} ${esc(s.name)}</b><br><small style="color:#888">${s.products.length} منتج</small></td>
  <td>${esc(s.cat)}</td><td>${esc(s.time)}</td><td>${s.min} ج</td>
  <td><button class="btn sm" onclick="editStore('${s.id}')">منتجات</button>
      <button class="btn sm red" onclick="delStore('${s.id}')">حذف</button></td></tr>`).join('')}
 </table>
 <details><summary>➕ ضيف متجر جديد</summary>
  <div class="grid2">
   <div><label>اسم المتجر</label><input id="nsName"></div>
   <div><label>القسم</label><input id="nsCat" placeholder="مثال: بقالة"></div>
   <div><label>وقت التوصيل</label><input id="nsTime" placeholder="30-45 دقيقة"></div>
   <div><label>الحد الأدنى (جنيه)</label><input id="nsMin" type="number" value="50"></div>
  </div>
  <button class="btn" style="margin-top:10px" onclick="addStore()">ضيف المتجر</button>
 </details>
 </div>
 ${selStore?renderProducts(stores.find(s=>s.id===selStore)):''}`;
}
function renderProducts(s){
 if(!s)return'';
 return `<div class="panel">
 <h2 style="margin-bottom:10px">📦 منتجات: ${esc(s.name)}</h2>
 <table><tr><th>المنتج</th><th>الوحدة</th><th>السعر</th><th></th></tr>
 ${s.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.unit)}</td><td>${p.price} ج</td>
  <td><button class="btn sm red" onclick="delProd('${s.id}','${p.id}')">حذف</button></td></tr>`).join('')}
 </table>
 <details open><summary>➕ ضيف منتج</summary>
  <div class="grid2">
   <div><label>اسم المنتج</label><input id="npName"></div>
   <div><label>الوحدة</label><input id="npUnit" placeholder="كيلو / قطعة / علبة"></div>
   <div><label>السعر (جنيه)</label><input id="npPrice" type="number" step="0.5"></div>
  </div>
  <button class="btn" style="margin-top:10px" onclick="addProd('${s.id}')">ضيف المنتج</button>
 </details>
 <button class="btn gray" style="margin-top:10px" onclick="selStore=null;render()">اقفل</button>
 </div>`;
}
function editStore(id){selStore=id;render()}
function addStore(){
 const n=document.getElementById('nsName').value.trim();if(!n)return alert('اكتب اسم المتجر');
 const s=getStores();
 s.push({id:'s'+Date.now(),name:n,cat:document.getElementById('nsCat').value.trim()||'عام',icon:'🏪',
  time:document.getElementById('nsTime').value.trim()||'30-45 دقيقة',
  min:parseFloat(document.getElementById('nsMin').value)||0,products:[]});
 saveStores(s);render();
}
function delStore(id){if(!confirm('تحذف المتجر وكل منتجاته؟'))return;saveStores(getStores().filter(s=>s.id!==id));if(selStore===id)selStore=null;render()}
function addProd(sid){
 const s=getStores();const st=s.find(x=>x.id===sid);if(!st)return;
 const n=document.getElementById('npName').value.trim(),u=document.getElementById('npUnit').value.trim(),
       pr=parseFloat(document.getElementById('npPrice').value);
 if(!n||!u||isNaN(pr))return alert('كمّل بيانات المنتج');
 st.products.push({id:'p'+Date.now(),name:n,unit:u,price:pr});
 saveStores(s);render();
}
function delProd(sid,pid){
 const s=getStores();const st=s.find(x=>x.id===sid);if(!st)return;
 st.products=st.products.filter(p=>p.id!==pid);saveStores(s);render();
}
</script>
</body>
</html>
