<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة أليكس شوب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',system-ui,sans-serif}
body{background:#f3f4f6;color:#1a1a1a}
header{background:#1f2937;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}
header .wrap{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{font-weight:800;font-size:1.2rem}
.logo small{display:block;font-size:.7rem;font-weight:400;opacity:.8}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:#374151;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.88rem}
.tabs button.on{background:#16a34a}
main{max-width:900px;margin:0 auto;padding:16px}
.panel{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:14px}
.order{border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.order .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.order .id{font-weight:800;color:#15803d}
.order .meta{font-size:.8rem;color:#666;margin-top:4px}
.order .items{font-size:.85rem;margin-top:8px;background:#f9fafb;border-radius:8px;padding:8px 10px}
.order .tot{font-weight:800;margin-top:6px}
.drv{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:8px}
@media(max-width:560px){.drv{grid-template-columns:1fr}}
select.st{padding:6px 10px;border-radius:8px;border:1.5px solid #d1d5db;font-weight:700;font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid #eee}
th{background:#f9fafb;font-size:.8rem;color:#555}
.btn{background:#16a34a;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.85rem}
.btn.gray{background:#6b7280}.btn.red{background:#dc2626}.btn.sm{padding:4px 10px;font-size:.78rem}
.btn:disabled{background:#9ca3af;cursor:not-allowed}
input,select{width:100%;padding:9px 11px;border:1.5px solid #d1d5db;border-radius:9px;font-size:.95rem;background:#fff}
label{display:block;font-weight:700;font-size:.82rem;margin:10px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.note{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:10px 14px;font-size:.8rem;margin-bottom:14px}
.empty{text-align:center;color:#999;padding:30px 0}
.gate{max-width:360px;margin:60px auto;background:#fff;border-radius:16px;padding:28px 22px;box-shadow:0 2px 12px rgba(0,0,0,.1);text-align:center}
.gate h2{margin-bottom:6px}
.gate p{font-size:.85rem;color:#666;margin-bottom:8px}
.gate .err{color:#dc2626;font-size:.8rem;margin-top:10px;display:none}
.gate .err.show{display:block}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700;font-size:.88rem;color:#15803d}
.refreshbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
</style>
</head>
<body>
<div class="gate" id="gate">
 <h2>🔐 لوحة الإدارة</h2>
 <p>أليكس شوب — Alex Shop</p>
 <label style="text-align:right">الإيميل</label>
 <input type="email" id="email" placeholder="إيميل الأدمن" style="text-align:center" dir="ltr">
 <label style="text-align:right">كلمة السر</label>
 <input type="password" id="pw" placeholder="كلمة السر" style="text-align:center">
 <button class="btn" id="loginBtn" style="width:100%;margin-top:12px" onclick="login()">دخول</button>
 <div class="err" id="loginErr">الإيميل أو كلمة السر غلط</div>
</div>
<div id="panel" style="display:none">
<header><div class="wrap">
 <div class="logo">🛠 لوحة إدارة أليكس شوب<small>المتاجر · المنتجات · الطلبات · الخصومات</small></div>
 <div class="tabs">
  <button id="tOrders" class="on" onclick="tab('orders')">الطلبات</button>
  <button id="tStores" onclick="tab('stores')">المتاجر والمنتجات</button>
  <button id="tCodes" onclick="tab('codes')">أكواد الخصم</button>
  <button id="tDrivers" onclick="tab('drivers')">المناديب</button>
  <button onclick="logout()">خروج</button>
 </div>
</div></header>
<main id="app"></main>
</div>
<script>
// ================== إعدادات قاعدة البيانات ==================
const SUPABASE_URL='https://uwovnuhwayekvcwkulgx.supabase.co';
const SUPABASE_KEY='sb_publishable_OQlxqtmGtmhQOjRdjFmsNA_sHMpAMUy';
// ============================================================
let TOKEN=null, REFRESH=null;
let ORDERS=[], STORES=[], CODES=[], DRIVERS=[], cur='orders', selStore=null;
const DRV_URL=location.href.replace(/[^\/]*$/,'driver.html?t=');
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('0'))d='2'+d;return d}
function copyTxt(t,okMsg){
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(t).then(()=>alert(okMsg)).catch(()=>prompt('انسخ اللينك ده:',t));
 }else prompt('انسخ اللينك ده:',t);
}
const app=document.getElementById('app');
const STATUSES=['جديد','مقبول','اتجهز','خرج للتوصيل','اتسلّم','ملغي'];
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function hdrs(json){const h={apikey:SUPABASE_KEY};if(TOKEN)h.Authorization='Bearer '+TOKEN;if(json)h['Content-Type']='application/json';return h}
async function api(path,opts){
 let r=await fetch(SUPABASE_URL+path,opts);
 if(r.status===401&&REFRESH){
  const ok=await refreshToken();
  if(ok)r=await fetch(SUPABASE_URL+path,opts);else{logout();throw 0}
 }
 return r;
}
async function login(){
 const em=document.getElementById('email').value.trim(),pw=document.getElementById('pw').value;
 const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='جاري الدخول...';
 document.getElementById('loginErr').classList.remove('show');
 try{
  const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',
   headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
   body:JSON.stringify({email:em,password:pw})});
  if(!r.ok)throw 0;
  const d=await r.json();
  TOKEN=d.access_token;REFRESH=d.refresh_token;
  sessionStorage.setItem('alexshop_admin',JSON.stringify({t:TOKEN,r:REFRESH}));
  showPanel();
 }catch(e){
  document.getElementById('loginErr').classList.add('show');
 }
 btn.disabled=false;btn.textContent='دخول';
}
async function refreshToken(){
 try{
  const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
   headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
   body:JSON.stringify({refresh_token:REFRESH})});
  if(!r.ok)return false;
  const d=await r.json();
  TOKEN=d.access_token;REFRESH=d.refresh_token;
  sessionStorage.setItem('alexshop_admin',JSON.stringify({t:TOKEN,r:REFRESH}));
  return true;
 }catch(e){return false}
}
function logout(){
 TOKEN=null;REFRESH=null;sessionStorage.removeItem('alexshop_admin');
 document.getElementById('panel').style.display='none';
 document.getElementById('gate').style.display='block';
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
async function showPanel(){
 document.getElementById('gate').style.display='none';
 document.getElementById('panel').style.display='block';
 await Promise.all([loadOrders(),loadStores(),loadCodes(),loadDrivers()]);
 render();
}
function tab(t){
 cur=t;
 document.getElementById('tOrders').className=t==='orders'?'on':'';
 document.getElementById('tStores').className=t==='stores'?'on':'';
 document.getElementById('tCodes').className=t==='codes'?'on':'';
 document.getElementById('tDrivers').className=t==='drivers'?'on':'';
 render();
}
async function loadOrders(){
 try{
  const r=await api('/rest/v1/orders?order=created_at.desc',{headers:hdrs()});
  if(!r.ok)throw 0;
  ORDERS=await r.json();
 }catch(e){}
 if(cur==='orders')render();
}
async function loadStores(){
 try{
  const r=await api('/rest/v1/stores?select=*&order=name',{headers:hdrs()});
  if(!r.ok)throw 0;
  STORES=(await r.json()).map(x=>({id:x.id,name:x.name,cat:x.cat,icon:x.icon,time:x.delivery_time,min:x.min_order,products:x.products||[]}));
 }catch(e){}
 if(cur==='stores')render();
}
async function loadCodes(){
 try{
  const r=await api('/rest/v1/discount_codes?select=*&order=created_at.desc',{headers:hdrs()});
  if(!r.ok)throw 0;
  CODES=await r.json();
 }catch(e){}
 if(cur==='codes')render();
}
async function loadDrivers(){
 try{
  const r=await api('/rest/v1/drivers?select=*&order=created_at',{headers:hdrs()});
  if(!r.ok)throw 0;
  DRIVERS=await r.json();
 }catch(e){}
 if(cur==='drivers')render();
}
function render(){cur==='orders'?renderOrders():cur==='stores'?renderStores():cur==='drivers'?renderDrivers():renderCodes()}
function renderOrders(){
 app.innerHTML=`<div class="panel">
 <div class="refreshbar"><h2>📦 الطلبات (${ORDERS.length})</h2>
 <button class="btn sm gray" onclick="loadOrders()">🔄 تحديث</button></div>
 ${ORDERS.length?ORDERS.map(o=>`
 <div class="order">
  <div class="top"><span class="id">AX-${o.id}</span>
   <select class="st" onchange="setStatus(${o.id},this.value)">
   ${STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>
  <div class="meta">👤 ${esc(o.customer_name)} · 📞 ${esc(o.phone)} · 💳 ${esc(o.payment)}</div>
  <div class="meta">📍 ${esc(o.address)}</div>
  ${o.location_lat!=null&&o.location_lng!=null?`<div class="meta">🗺 <a href="https://maps.google.com/?q=${o.location_lat},${o.location_lng}" target="_blank" style="color:#2563eb;font-weight:700">افتح موقع العميل على الخريطة</a></div>`:''}
  <div class="meta">🕐 ${new Date(o.created_at).toLocaleString('ar-EG')}</div>
  ${o.status==='مقبول'?`<button class="btn sm" style="margin-top:8px;background:#0891b2" onclick="setStatus(${o.id},'اتجهز')">✅ الطلب اتجهز — التعيين أوتوماتيك</button>`:''}
  <div class="items">${(o.items||[]).map(x=>`${esc(x.name)} × ${x.qty} (${x.price*x.qty} ج) — ${esc(x.store)}`).join('<br>')}</div>
  ${o.discount>0?`<div class="meta" style="color:#15803d;font-weight:700">🎟 خصم: −${o.discount} ج${o.discount_code?' ('+esc(o.discount_code)+')':''}</div>`:''}
  <div class="tot">الإجمالي: ${o.total} ج (شامل توصيل ${o.fee} ج)</div>
  <div class="drv">
   <select id="ds-${o.id}" class="st" style="width:100%">
    <option value="" ${(!o.driver_id&&!o.driver_name)?'selected':''}>— بدون مندوب —</option>
    ${DRIVERS.filter(d=>d.active||d.id===o.driver_id).map(d=>`<option value="${d.id}" ${d.id===o.driver_id?'selected':''}>🛵 ${esc(d.name)}${d.phone?' ('+esc(d.phone)+')':''}</option>`).join('')}
    ${(!o.driver_id&&o.driver_name)?`<option value="" selected disabled>(مسجل يدوي: ${esc(o.driver_name)})</option>`:''}
   </select>
   <button class="btn sm" onclick="setDriver(${o.id})">حفظ المندوب</button>
  </div>
 </div>`).join(''):'<div class="empty">مفيش طلبات لسه. أول ما عميل يطلب من الموقع هيظهر هنا.</div>'}
 </div>`;
}
async function setStatus(id,v){
 const o=ORDERS.find(x=>x.id===id);if(o)o.status=v;
 try{
  const r=await api('/rest/v1/orders?id=eq.'+id,{method:'PATCH',headers:hdrs(true),body:JSON.stringify({status:v})});
  if(!r.ok)throw 0;
 }catch(e){alert('حصلت مشكلة في تحديث الحالة');loadOrders()}
}
async function setDriver(id){
 const v=document.getElementById('ds-'+id).value;
 const d=DRIVERS.find(x=>x.id===v);
 const body=d?{driver_id:d.id,driver_name:d.name,driver_phone:d.phone||null}
             :{driver_id:null,driver_name:null,driver_phone:null};
 try{
  const r=await api('/rest/v1/orders?id=eq.'+id,{method:'PATCH',headers:hdrs(true),body:JSON.stringify(body)});
  if(!r.ok)throw 0;
  const o=ORDERS.find(x=>x.id===id);if(o)Object.assign(o,body);
  alert(d?('اتحفظ ✅ الطلب بقى مع '+d.name+' — لو مبعتلوش اللينك قبل كده، انسخه من تاب المناديب')
         :'اتشال المندوب من الطلب ✅');
 }catch(e){alert('حصلت مشكلة في حفظ المندوب')}
}
function renderDrivers(){
 app.innerHTML=`<div class="panel">
 <div class="refreshbar"><h2>🛵 المناديب (${DRIVERS.length})</h2>
 <button class="btn sm gray" onclick="loadDrivers()">🔄 تحديث</button></div>
 <div class="note">كل مندوب ليه <b>لينك خاص بيه</b>: بيفتحه يشوف الطلبات اللي عليه بس ويحدّث حالتها (خرج للتوصيل ← اتسلّم). اللينك زي كلمة سر — متبعتوش غير للمندوب نفسه.</div>
 ${DRIVERS.length?`<table><tr><th>المندوب</th><th>الموبايل</th><th>الحالة</th><th>التاحة</th><th></th></tr>
 ${DRIVERS.map(d=>`<tr>
  <td><b>${esc(d.name)}</b></td>
  <td dir="ltr">${esc(d.phone||'—')}</td>
  <td>${d.active?'✅ شغال':'⏸ متوقف'}</td>
  <td>${d.on_duty?'🟢 متاح':'🔴 مش متاح'}</td>
  <td style="white-space:nowrap">
   <button class="btn sm" onclick="copyTxt(DRV_URL+'${d.token}','اللينك اتنسخ ✅ ابعته للمندوب')">نسخ اللينك</button>
   ${d.phone?`<a class="btn sm" style="text-decoration:none;display:inline-block" target="_blank" href="https://wa.me/${waNum(d.phone)}?text=${encodeURIComponent('لينك صفحة طلباتك في أليكس شوب (ليك انت بس، متبعتوش لحد):\n'+DRV_URL+d.token)}">ابعت واتساب</a>`:''}
   <button class="btn sm gray" onclick="toggleDriver('${d.id}',${!d.active})">${d.active?'أوقف':'شغّل'}</button>
  </td></tr>`).join('')}
 </table>`:'<div class="empty">مفيش مناديب لسه. ضيف أول مندوب من تحت.</div>'}
 <details open><summary>➕ ضيف مندوب جديد</summary>
  <div class="grid2">
   <div><label>اسم المندوب</label><input id="ndName" placeholder="مثال: كابتن أحمد"></div>
   <div><label>موبايل المندوب</label><input id="ndPhone" dir="ltr" inputmode="tel" placeholder="01xxxxxxxxx"></div>
  </div>
  <button class="btn" style="margin-top:10px" onclick="addDriver()">ضيف المندوب</button>
 </details>
 </div>`;
}
async function addDriver(){
 const n=document.getElementById('ndName').value.trim();
 const p=document.getElementById('ndPhone').value.trim();
 if(!n)return alert('اكتب اسم المندوب');
 try{
  const r=await api('/rest/v1/drivers',{method:'POST',headers:{...hdrs(true),Prefer:'return=representation'},body:JSON.stringify({name:n,phone:p||null})});
  if(!r.ok)throw 0;
  const rows=await r.json();
  await loadDrivers();
  if(rows&&rows[0]&&rows[0].token){
   copyTxt(DRV_URL+rows[0].token,'اتضاف ✅ واللينك اتنسخ — ابعته للمندوب دلوقتي');
  }else{
   alert('اتضاف ✅ انسخ اللينك من الجدول');
  }
 }catch(e){alert('حصلت مشكلة في إضافة المندوب')}
}
async function toggleDriver(id,on){
 if(!on&&!confirm('إيقاف المندوب؟ لينكه هيقف على طول ومش هيقدر يفتح صفحته.'))return;
 try{
  const r=await api('/rest/v1/drivers?id=eq.'+id,{method:'PATCH',headers:hdrs(true),body:JSON.stringify({active:on})});
  if(!r.ok)throw 0;
  await loadDrivers();
 }catch(e){alert('حصلت مشكلة في تحديث المندوب')}
}
function renderCodes(){
 app.innerHTML=`<div class="panel">
 <div class="refreshbar"><h2>🎟 أكواد الخصم (${CODES.length})</h2>
 <button class="btn sm gray" onclick="loadCodes()">🔄 تحديث</button></div>
 ${CODES.length?`<table><tr><th>الكود</th><th>قيمة الخصم</th><th>الحالة</th><th></th></tr>
 ${CODES.map(c=>`<tr>
  <td><b dir="ltr">${esc(c.code)}</b></td>
  <td>${c.value} ج</td>
  <td>${c.active?'✅ شغال':'⏸ متوقف'}</td>
  <td><button class="btn sm gray" onclick="toggleCode('${c.code}',${!c.active})">${c.active?'أوقف':'شغّل'}</button>
      <button class="btn sm red" onclick="delCode('${c.code}')">حذف</button></td></tr>`).join('')}
 </table>`:'<div class="empty">مفيش أكواد لسه. ضيف أول كود من تحت.</div>'}
 <details open><summary>➕ ضيف كود جديد</summary>
  <div class="grid2">
   <div><label>الكود (حروف إنجليزي وأرقام)</label><input id="ncCode" dir="ltr" placeholder="ALEX10"></div>
   <div><label>قيمة الخصم (جنيه)</label><input id="ncVal" type="number" min="1" step="1" placeholder="10"></div>
  </div>
  <button class="btn" style="margin-top:10px" onclick="addCode()">ضيف الكود</button>
 </details>
 </div>`;
}
async function addCode(){
 let code=document.getElementById('ncCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
 const v=parseFloat(document.getElementById('ncVal').value);
 if(!code)return alert('اكتب الكود بالإنجليزي (حروف وأرقام بس)');
 if(isNaN(v)||v<=0)return alert('اكتب قيمة الخصم بالجنيه');
 try{
  const r=await api('/rest/v1/discount_codes',{method:'POST',headers:{...hdrs(true),Prefer:'resolution=merge-duplicates'},body:JSON.stringify({code:code,value:v,active:true})});
  if(!r.ok)throw 0;
  await loadCodes();
 }catch(e){alert('حصلت مشكلة في إضافة الكود')}
}
async function toggleCode(code,on){
 try{
  const r=await api('/rest/v1/discount_codes?code=eq.'+encodeURIComponent(code),{method:'PATCH',headers:hdrs(true),body:JSON.stringify({active:on})});
  if(!r.ok)throw 0;
  await loadCodes();
 }catch(e){alert('حصلت مشكلة في تحديث الكود')}
}
async function delCode(code){
 if(!confirm('تحذف الكود '+code+'؟'))return;
 try{
  const r=await api('/rest/v1/discount_codes?code=eq.'+encodeURIComponent(code),{method:'DELETE',headers:hdrs()});
  if(!r.ok)throw 0;
  await loadCodes();
 }catch(e){alert('حصلت مشكلة في حذف الكود')}
}
function renderStores(){
 app.innerHTML=`
 <div class="panel">
 <h2 style="margin-bottom:10px">🏪 المتاجر (${STORES.length})</h2>
 <table><tr><th>المتجر</th><th>القسم</th><th>وقت التوصيل</th><th>حد أدنى</th><th></th></tr>
 ${STORES.map(s=>`<tr>
  <td><b>${s.icon||'🏪'} ${esc(s.name)}</b><br><small style="color:#888">${s.products.length} منتج</small></td>
  <td>${esc(s.cat)}</td><td>${esc(s.time)}</td><td>${s.min} ج</td>
  <td><button class="btn sm" onclick="editStore('${s.id}')">منتجات</button>
      <button class="btn sm red" onclick="delStore('${s.id}')">حذف</button></td></tr>`).join('')}
 </table>
 <details><summary>➕ ضيف متجر جديد</summary>
  <div class="grid2">
   <div><label>اسم المتجر</label><input id="nsName"></div>
   <div><label>القسم</label><input id="nsCat" placeholder="مثال: بقالة"></div>
   <div><label>وقت التوصيل</label><input id="nsTime" placeholder="30-45 دقيقة"></div>
   <div><label>الحد الأدنى (جنيه)</label><input id="nsMin" type="number" value="50"></div>
  </div>
  <button class="btn" style="margin-top:10px" onclick="addStore()">ضيف المتجر</button>
 </details>
 </div>
 ${selStore?renderProducts(STORES.find(s=>s.id===selStore)):''}`;
}
function renderProducts(s){
 if(!s)return'';
 return `<div class="panel">
 <h2 style="margin-bottom:10px">📦 منتجات: ${esc(s.name)}</h2>
 <table><tr><th>المنتج</th><th>الوحدة</th><th>السعر</th><th></th></tr>
 ${s.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.unit)}</td><td>${p.price} ج</td>
  <td><button class="btn sm red" onclick="delProd('${s.id}','${p.id}')">حذف</button></td></tr>`).join('')}
 </table>
 <details open><summary>➕ ضيف منتج</summary>
  <div class="grid2">
   <div><label>اسم المنتج</label><input id="npName"></div>
   <div><label>الوحدة</label><input id="npUnit" placeholder="كيلو / قطعة / علبة"></div>
   <div><label>السعر (جنيه)</label><input id="npPrice" type="number" step="0.5"></div>
  </div>
  <button class="btn" style="margin-top:10px" onclick="addProd('${s.id}')">ضيف المنتج</button>
 </details>
 <button class="btn gray" style="margin-top:10px" onclick="selStore=null;render()">اقفل</button>
 </div>`;
}
function editStore(id){selStore=id;render()}
async function addStore(){
 const n=document.getElementById('nsName').value.trim();if(!n)return alert('اكتب اسم المتجر');
 const row={id:'s'+Date.now(),name:n,cat:document.getElementById('nsCat').value.trim()||'عام',icon:'🏪',
  delivery_time:document.getElementById('nsTime').value.trim()||'30-45 دقيقة',
  min_order:parseFloat(document.getElementById('nsMin').value)||0,products:[]};
 try{
  const r=await api('/rest/v1/stores',{method:'POST',headers:hdrs(true),body:JSON.stringify(row)});
  if(!r.ok)throw 0;
  await loadStores();
 }catch(e){alert('حصلت مشكلة في إضافة المتجر')}
}
async function delStore(id){
 if(!confirm('تحذف المتجر وكل منتجاته؟'))return;
 try{
  const r=await api('/rest/v1/stores?id=eq.'+id,{method:'DELETE',headers:hdrs()});
  if(!r.ok)throw 0;
  if(selStore===id)selStore=null;
  await loadStores();
 }catch(e){alert('حصلت مشكلة في حذف المتجر')}
}
async function saveProducts(s){
 const r=await api('/rest/v1/stores?id=eq.'+s.id,{method:'PATCH',headers:hdrs(true),body:JSON.stringify({products:s.products})});
 if(!r.ok)throw 0;
}
async function addProd(sid){
 const st=STORES.find(x=>x.id===sid);if(!st)return;
 const n=document.getElementById('npName').value.trim(),u=document.getElementById('npUnit').value.trim(),
       pr=parseFloat(document.getElementById('npPrice').value);
 if(!n||!u||isNaN(pr))return alert('كمّل بيانات المنتج');
 st.products.push({id:'p'+Date.now(),name:n,unit:u,price:pr});
 try{await saveProducts(st);await loadStores()}catch(e){alert('حصلت مشكلة في إضافة المنتج');await loadStores()}
}
async function delProd(sid,pid){
 const st=STORES.find(x=>x.id===sid);if(!st)return;
 st.products=st.products.filter(p=>p.id!==pid);
 try{await saveProducts(st);await loadStores()}catch(e){alert('حصلت مشكلة في حذف المنتج');await loadStores()}
}
// لو كان مسجل دخول قبل كده في نفس الجلسة
try{
 const s=JSON.parse(sessionStorage.getItem('alexshop_admin'));
 if(s&&s.t){TOKEN=s.t;REFRESH=s.r;showPanel()}
}catch(e){}
</script>
</body>
