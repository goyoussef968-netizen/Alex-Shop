<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Shop | أليكس شوب - توصيل أكل وبقالة في العجمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=El+Messiri:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',system-ui,sans-serif}
:root{--bg:#0e0f12;--card:#17191e;--card2:#101114;--text:#f2ede3;--muted:#96907f;--gold:#d4af37;--gold2:#f5d67b;--golddk:#1a1505;--border:rgba(212,175,55,.18);--border2:rgba(212,175,55,.4);--inputbg:#101114;--green:#25d366;--red:#f87171}
body.light{--bg:#f6f3ec;--card:#ffffff;--card2:#fdfbf6;--text:#23211a;--muted:#7d7869;--gold:#a8842a;--gold2:#8f6f1f;--golddk:#fdf6e0;--border:rgba(150,120,40,.25);--border2:rgba(150,120,40,.45);--inputbg:#ffffff;--green:#1fa855;--red:#dc2626}
body{background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
header .wrap{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{font-family:'El Messiri',serif;font-weight:700;font-size:1.25rem;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}
.logo small{display:block;font-family:'Cairo';font-size:.62rem;font-weight:400;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.hbtns{display:flex;gap:8px}
#trackBtn{background:transparent;color:var(--text);border:1px solid var(--border2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.8rem;cursor:pointer}
#cartBtn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--golddk);border:none;border-radius:999px;padding:6px 14px;font-weight:800;font-size:.88rem;cursor:pointer;position:relative}
#cartCount{position:absolute;top:-6px;left:-6px;background:var(--bg);border:1px solid var(--gold);color:var(--gold2);border-radius:50%;width:20px;height:20px;font-size:.72rem;display:flex;align-items:center;justify-content:center;font-weight:800}
main{max-width:720px;margin:0 auto;padding:16px 16px 110px}
.hero{position:relative;margin:4px 0 8px;padding:32px 22px 28px;border-radius:22px;overflow:hidden;background:radial-gradient(120% 140% at 85% 0%,rgba(212,175,55,.14),transparent 55%),linear-gradient(160deg,var(--card),var(--card2) 70%);border:1px solid var(--border);text-align:center}
.hero::before{content:"✦";position:absolute;top:14px;left:20px;color:var(--gold);opacity:.5;font-size:.9rem}
.hero::after{content:"✦";position:absolute;bottom:14px;right:20px;color:var(--gold);opacity:.5;font-size:.9rem}
.hero .kicker{font-size:.72rem;letter-spacing:3px;color:var(--gold);font-weight:700;margin-bottom:10px}
.hero h1{font-family:'El Messiri',serif;font-size:1.75rem;font-weight:700;line-height:1.55;background:linear-gradient(135deg,var(--text),var(--gold2) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:.88rem;margin-top:10px;line-height:1.9}
.hero .orn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;color:var(--gold);font-size:.7rem}
.hero .orn::before,.hero .orn::after{content:"";height:1px;width:52px;background:linear-gradient(90deg,transparent,var(--border2),transparent)}
.sec{display:flex;align-items:center;gap:12px;margin:24px 2px 12px}
.sec h2{font-family:'El Messiri',serif;font-size:1.15rem;font-weight:600;white-space:nowrap}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent)}
.store{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer;display:flex;gap:14px;align-items:center;transition:transform .15s}
.store:active{transform:scale(.985)}
.store .icon{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(212,175,55,.15),transparent);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:1.55rem;flex-shrink:0}
.store h3{font-family:'El Messiri',serif;font-size:1.08rem;font-weight:600}
.store .meta{font-size:.76rem;color:var(--muted);margin-top:3px}
.badge{display:inline-block;font-size:.68rem;color:var(--gold2);border:1px solid var(--border2);border-radius:999px;padding:3px 10px;font-weight:700;margin-inline-end:5px;margin-top:5px}
body.light .badge{color:var(--gold)}
.back{display:inline-block;background:none;border:1px solid var(--border2);border-radius:999px;color:var(--gold2);font-weight:700;font-size:.82rem;cursor:pointer;margin-bottom:12px;padding:7px 16px}
body.light .back{color:var(--gold)}
.panel{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:12px}
.panel h2{font-family:'El Messiri',serif;font-size:1.2rem}
.panel .sub{font-size:.82rem;color:var(--muted);margin-top:5px}
.prod{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.prod .info{flex:1}
.prod .name{font-weight:700;font-size:.95rem}
.prod .unit{font-size:.74rem;color:var(--muted);margin-top:2px}
.prod .price{font-family:'El Messiri',serif;color:var(--gold2);font-weight:700;font-size:1rem;margin-top:5px}
body.light .prod .price{color:var(--gold)}
.addbtn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--golddk);border:none;border-radius:999px;padding:8px 22px;font-weight:800;cursor:pointer;font-size:.85rem;box-shadow:0 4px 14px rgba(212,175,55,.2)}
.stepper{display:flex;align-items:center;gap:12px;border:1px solid var(--border2);border-radius:999px;padding:4px 10px}
.stepper button{width:26px;height:26px;background:none;border:none;color:var(--gold2);font-size:1.15rem;font-weight:800;cursor:pointer}
body.light .stepper button{color:var(--gold)}
.stepper .q{font-weight:800;min-width:16px;text-align:center;color:var(--gold2)}
body.light .stepper .q{color:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .nm{flex:1}
.totalrow{display:flex;justify-content:space-between;padding:6px 0;font-size:.95rem}
.totalrow.grand{font-weight:800;font-size:1.1rem;border-top:1px solid var(--border2);margin-top:6px;padding-top:10px;font-family:'El Messiri',serif}
.cta{display:block;width:100%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--golddk);border:none;border-radius:999px;padding:14px;font-size:1.02rem;font-weight:800;cursor:pointer;margin-top:14px;box-shadow:0 6px 20px rgba(212,175,55,.22)}
.cta:disabled{background:#6b7280;color:#e5e7eb;cursor:not-allowed;box-shadow:none}
.cta.ghost{background:transparent;color:var(--text);border:1px solid var(--border2);box-shadow:none}
.locbtn{display:block;width:100%;background:transparent;color:var(--gold);border:1.5px solid var(--border2);border-radius:999px;padding:12px;font-weight:800;font-size:.95rem;cursor:pointer;margin-top:4px}
.locbtn:disabled{opacity:.6;cursor:wait}
.locmsg{font-size:.82rem;min-height:1.1em;margin-top:6px;color:var(--muted);text-align:center}
.locmsg.ok{color:var(--green)}
.locmsg.warn{color:var(--gold2)}
label{display:block;font-weight:700;font-size:.86rem;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border2);border-radius:12px;font-size:1rem;background:var(--inputbg);color:var(--text)}
textarea{resize:vertical;font-family:inherit}
input:focus{outline:none;border-color:var(--gold)}
input::placeholder{color:var(--muted);opacity:.7}
.err{color:var(--red);font-size:.8rem;margin-top:4px;display:none}
.err.show{display:block}
.pay{display:flex;gap:10px;margin-top:6px}
.pay label.opt{flex:1;border:1.5px solid var(--border2);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-weight:700;font-size:.85rem;margin:0}
.pay input{display:none}
.pay input:checked+span{color:var(--gold2)}
body.light .pay input:checked+span{color:var(--gold)}
.pay label.opt:has(input:checked){border-color:var(--gold);background:rgba(212,175,55,.1)}
.confirm{text-align:center;padding:26px 10px}
.confirm .check{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--golddk);font-size:2.2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 26px rgba(212,175,55,.3)}
.confirm h2{font-family:'El Messiri',serif;margin-bottom:8px}
.confirm .num{background:rgba(212,175,55,.12);color:var(--gold2);border:1px solid var(--border2);font-weight:800;border-radius:12px;padding:8px 20px;display:inline-block;margin:10px 0;font-size:1.1rem}
body.light .confirm .num{color:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.disc{display:flex;gap:8px;margin-top:12px}
.disc input{flex:1}
.disc .addbtn{white-space:nowrap}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
.tabbar .wrap{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;color:var(--muted);font-size:.68rem;font-weight:700;cursor:pointer;border:none;background:none;font-family:'Cairo'}
.tab .ic{font-size:1.25rem}
.tab.on{color:var(--gold)}
.ptop{display:flex;align-items:center;gap:14px;margin:8px 0 4px}
.avatar{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(212,175,55,.25),transparent);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'El Messiri',serif;font-size:1.5rem;color:var(--gold);flex-shrink:0}
.ptop .nm{font-family:'El Messiri',serif;font-size:1.2rem;font-weight:700}
.ptop .ph{font-size:.8rem;color:var(--muted);margin-top:2px}
.tier{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:.72rem;font-weight:800;color:var(--golddk);background:linear-gradient(135deg,var(--gold2),var(--gold));border-radius:999px;padding:4px 12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0 4px}
.stat{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:16px;padding:14px 8px;text-align:center}
.stat .v{font-family:'El Messiri',serif;font-size:1.15rem;font-weight:700;color:var(--gold2)}
body.light .stat .v{color:var(--gold)}
.stat .k{font-size:.68rem;color:var(--muted);margin-top:4px;font-weight:700}
.ordrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--border);cursor:pointer}
.ordrow:last-child{border-bottom:none}
.ordrow .t{font-weight:700;font-size:.9rem}
.ordrow .d{font-size:.73rem;color:var(--muted);margin-top:3px}
.ordrow .amt{font-family:'El Messiri',serif;color:var(--gold2);font-weight:700;white-space:nowrap}
body.light .ordrow .amt{color:var(--gold)}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:right;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer;color:var(--text);font-family:'Cairo';text-decoration:none}
.bigbtn .ic{width:50px;height:50px;border-radius:50%;border:1px solid var(--border2);background:radial-gradient(circle at 30% 25%,rgba(212,175,55,.18),transparent);display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex-shrink:0}
.bigbtn .t{font-weight:800;font-size:.95rem}
.bigbtn .d{font-size:.75rem;color:var(--muted);margin-top:3px}
.gbtn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--golddk);border:none;border-radius:999px;padding:8px 20px;font-weight:800;font-size:.82rem;cursor:pointer}
.ghostbtn{background:none;border:1px solid var(--border2);color:var(--text);border-radius:999px;padding:8px 18px;font-weight:700;font-size:.8rem;cursor:pointer;font-family:'Cairo'}
.notecard{font-size:.72rem;color:var(--muted);text-align:center;margin-top:14px;line-height:1.8}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px;border-bottom:1px solid var(--border)}
.setrow:last-child{border-bottom:none}
.setrow .t{font-weight:700;font-size:.92rem}
.setrow .d{font-size:.74rem;color:var(--muted);margin-top:3px}
</style>
</head>
<body>
<header><div class="wrap">
<div class="logo" onclick="go('home')">أليكس شوب<small>توصيل من محلات العجمي لباب بيتك</small></div>
<div class="hbtns"><button id="trackBtn" onclick="location.href='track.html'">📦 تابع طلبك</button><button id="cartBtn" onclick="go('cart')">السلة <span id="cartCount">0</span></button></div>
</div></header>
<main id="app"></main>
<div class="tabbar"><div class="wrap">
 <button class="tab" data-v="profile" onclick="go('profile')"><span class="ic">👤</span>الملف</button>
 <button class="tab" data-v="support" onclick="go('support')"><span class="ic">💬</span>الدعم</button>
 <button class="tab" data-v="order" onclick="go('home')"><span class="ic">🛍</span>اطلب</button>
 <button class="tab" data-v="settings" onclick="go('settings')"><span class="ic">⚙️</span>الإعدادات</button>
</div></div>
<script>
// ================== إعدادات قاعدة البيانات ==================
const SUPABASE_URL='https://uwovnuhwayekvcwkulgx.supabase.co';
const SUPABASE_KEY='sb_publishable_OQlxqtmGtmhQOjRdjFmsNA_sHMpAMUy';
// رقم واتساب الدعم بالكود الدولي من غير + ومن غير أصفار الأول
const SUPPORT_WA='201202255463';
// ============================================================
const K_CART='alexshop_cart_v1';
const K_DISC='alexshop_discount';
const K_ORDERS='alexshop_orders';
const K_THEME='alexshop_theme';
const K_AREA='alexshop_area';
const DEFAULT_STORES=[
 {id:'s1',name:'سوبر ماركت النور',cat:'بقالة وسوبر ماركت',icon:'🏪',time:'30-45 دقيقة',min:50,products:[
  {id:'p1',name:'أرز مصري فاخر',unit:'كيلو',price:38},{id:'p2',name:'سكر',unit:'كيلو',price:32},
  {id:'p3',name:'زيت عباد الشمس',unit:'700 مل',price:75},{id:'p4',name:'مكرونة',unit:'400 جم',price:14},
  {id:'p5',name:'شاي ليبتون',unit:'100 فتلة',price:85},{id:'p6',name:'جبنة رومي',unit:'كيلو',price:280}]},
 {id:'s2',name:'خضار وفاكهة الحاج سيد',cat:'خضار وفاكهة',icon:'🥬',time:'25-40 دقيقة',min:30,products:[
  {id:'p1',name:'طماطم',unit:'كيلو',price:18},{id:'p2',name:'بطاطس',unit:'كيلو',price:16},
  {id:'p3',name:'بصل',unit:'كيلو',price:20},{id:'p4',name:'موز',unit:'كيلو',price:35},
  {id:'p5',name:'برتقال',unit:'كيلو',price:22},{id:'p6',name:'خيار',unit:'كيلو',price:20}]},
 {id:'s3',name:'مخبز العائلة',cat:'مخبوزات',icon:'🥐',time:'20-30 دقيقة',min:20,products:[
  {id:'p1',name:'عيش بلدي',unit:'5 أرغفة',price:15},{id:'p2',name:'عيش فينو',unit:'5 أرغفة',price:20},
  {id:'p3',name:'كرواسون بالشوكولاتة',unit:'قطعة',price:18},{id:'p4',name:'باتيه باللحمة',unit:'قطعة',price:22},
  {id:'p5',name:'قطر الشام',unit:'كيلو',price:90}]},
 {id:'s4',name:'بن البرازيلي',cat:'قهوة ومحمصة',icon:'☕',time:'35-50 دقيقة',min:40,products:[
  {id:'p1',name:'بن تركي سادة',unit:'ربع كيلو',price:95},{id:'p2',name:'بن فرنساوي',unit:'ربع كيلو',price:105},
  {id:'p3',name:'مكسرات مشكلة',unit:'ربع كيلو',price:120},{id:'p4',name:'لب سوري',unit:'ربع كيلو',price:65}]}
];
let STORES=DEFAULT_STORES;
async function loadStores(){
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/stores?select=*&order=name',{headers:{apikey:SUPABASE_KEY}});
  if(!r.ok)throw 0;
  const d=await r.json();
  if(d.length)STORES=d.map(x=>({id:x.id,name:x.name,cat:x.cat,icon:x.icon,time:x.delivery_time,min:x.min_order,products:x.products||[]}));
 }catch(e){/* لو مفيش نت نعرض البيانات الافتراضية */}
 render();
}
function getStores(){return STORES}
function getCart(){try{return JSON.parse(localStorage.getItem(K_CART))||[]}catch(e){return[]}}
function setCart(c){localStorage.setItem(K_CART,JSON.stringify(c));updateCount()}
function updateCount(){document.getElementById('cartCount').textContent=getCart().reduce((a,i)=>a+i.qty,0)}
function findProd(pid){for(const s of getStores())for(const p of s.products)if(s.id+'/'+p.id===pid)return{...p,storeId:s.id,storeName:s.name};return null}
function addToCart(pid){const c=getCart();const f=c.find(i=>i.id===pid);if(f)f.qty++;else c.push({id:pid,qty:1});setCart(c);render()}
function decCart(pid){let c=getCart();const f=c.find(i=>i.id===pid);if(!f)return;f.qty--;if(f.qty<=0)c=c.filter(i=>i.id!==pid);setCart(c);render()}
function cartQty(pid){const f=getCart().find(i=>i.id===pid);return f?f.qty:0}
function fee(){return 20}
function getDisc(){try{return JSON.parse(localStorage.getItem(K_DISC))||null}catch(e){return null}}
function setDisc(d){try{if(d)localStorage.setItem(K_DISC,JSON.stringify(d));else localStorage.removeItem(K_DISC)}catch(e){}}
function discAmount(sub){const d=getDisc();if(!d||sub<=0)return 0;return Math.min(d.value,sub+fee())}
// ===== المظهر (داكن/فاتح) — محفوظ على الجهاز =====
function getTheme(){try{return localStorage.getItem(K_THEME)||'dark'}catch(e){return 'dark'}}
function applyTheme(){document.body.classList.toggle('light',getTheme()==='light')}
function setTheme(t){try{localStorage.setItem(K_THEME,t)}catch(e){}applyTheme();render()}
applyTheme();
// ===== سجل الطلبات المحلي (على جهاز العميل بس — مش على السيرفر) =====
function getOrders(){try{return JSON.parse(localStorage.getItem(K_ORDERS))||[]}catch(e){return[]}}
function saveOrderRec(rec){try{const a=getOrders();a.unshift(rec);localStorage.setItem(K_ORDERS,JSON.stringify(a.slice(0,50)))}catch(e){}}
function tierOf(n){return n>=15?'💎 عميل بلاتيني':n>=5?'🥇 عميل ذهبي':n>=3?'🥈 عميل فضي':'🌱 عميل جديد'}
function getArea(){try{return localStorage.getItem(K_AREA)||''}catch(e){return ''}}
function saveArea(){const v=document.getElementById('fArea').value.trim();try{if(v)localStorage.setItem(K_AREA,v);else localStorage.removeItem(K_AREA)}catch(e){}render()}
function go(v,arg){state={view:v,arg};window.scrollTo(0,0);render()}
let state={view:'home'};
let geoLat=null,geoLng=null;
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function markTab(){
 let v=state.view;
 let t=(v==='profile'||v==='support'||v==='settings')?v:'order';
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===t));
}
function render(){
 updateCount();
 markTab();
 if(state.view==='home'){
  const stores=getStores();
  app.innerHTML=`
  <div class="hero">
   <div class="kicker">ALEX SHOP · العجمي</div>
   <h1>كل اللي تحتاجه من محلات منطقتك<br>يوصلك لباب البيت</h1>
   <p>تشكيلة مختارة من أجود المحلات — أكل، بقالة، وحاجات البيت كلها.<br>اطلب في دقيقة، والتوصيل علينا.</p>
   <div class="orn">تجربة تسوّق تليق بيك</div>
  </div>
  <div class="sec"><h2>المحلات</h2></div>
  ${stores.map(s=>`<div class="store" onclick="go('store','${s.id}')">

async function applyDiscount(){
 const inp=document.getElementById('fDisc');
 const code=inp.value.trim();
 if(!code)return;
 const btn=document.getElementById('discBtn');btn.disabled=true;btn.textContent='بنشيك...';
 let errText=null;
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/check_discount',{method:'POST',
   headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
   body:JSON.stringify({p_code:code})});
  if(!r.ok)throw 0;
  const v=await r.json();
  if(v===null||typeof v!=='number'){
   setDisc(null);
   errText='الكود ده مش صح أو مش شغال دلوقتي';
  }else{
   setDisc({code:code.toUpperCase(),value:v});
  }
 }catch(e){
  errText='حصلت مشكلة في الاتصال. اتأكد من الإنترنت وجرب تاني.';
 }
 render();
 if(errText){
  const m=document.getElementById('discMsg');
  if(m){m.textContent=errText;m.classList.add('show');}
 }
}
function rmDisc(){setDisc(null);render()}
async function sendSupport(){
 const n=document.getElementById('sName').value.trim(),
       ph=document.getElementById('sPhone').value.trim(),
       m=document.getElementById('sMsg').value.trim(),
       e=document.getElementById('eSupp'),
       btn=document.getElementById('suppBtn');
 e.classList.remove('show');
 if(!/^01[0-9]{9}$/.test(ph.replace(/\s/g,''))){e.textContent='اكتب رقم موبايل صحيح (11 رقم يبدأ بـ 01)';e.classList.add('show');return}
 if(m.length<2){e.textContent='اكتب رسالتك الأول';e.classList.add('show');return}
 btn.disabled=true;btn.textContent='جاري الإرسال...';
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/submit_support_message',{method:'POST',
   headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
   body:JSON.stringify({p_name:n||null,p_phone:ph,p_message:m})});
  const d=await r.json().catch(()=>null);
  if(!r.ok||!d||!d.ok)throw ((d&&d.msg)||0);
  document.getElementById('sMsg').value='';
  try{localStorage.setItem('alexshop_phone',ph);if(n)localStorage.setItem('alexshop_name',n)}catch(_){}
  btn.textContent='✓ وصلت رسالتك — هنرد عليك قريب';
  setTimeout(()=>{btn.disabled=false;btn.textContent='ابعت الرسالة'},4000);
 }catch(x){
  btn.disabled=false;btn.textContent='ابعت الرسالة';
  e.textContent=(typeof x==='string'&&x)?x:'حصلت مشكلة في الإرسال — جرّب تاني أو كلمنا واتساب';
  e.classList.add('show');
 }
}

let authMode='login';
function getToken(){try{return localStorage.getItem('alexshop_token')||''}catch(e){return ''}}
function saveSession(t,ph,n){try{localStorage.setItem('alexshop_token',t);localStorage.setItem('alexshop_phone',ph);if(n)localStorage.setItem('alexshop_name',n)}catch(e){}}

async function authSubmit(fn){
 const ph=document.getElementById('aPhone').value.trim().replace(/\s/g,''),
       pw=document.getElementById('aPass').value,
       nmEl=document.getElementById('aName'),
       nm=nmEl?nmEl.value.trim():'',
       e=document.getElementById('eAuth'),
       btn=document.getElementById('authBtn');
 e.classList.remove('show');
 if(!/^01[0-9]{9}$/.test(ph)){e.textContent='اكتب رقم موبايل صحيح (11 رقم يبدأ بـ 01)';e.classList.add('show');return}
 if(pw.length<6){e.textContent='كلمة السر لازم تكون 6 حروف أو أرقام على الأقل';e.classList.add('show');return}
 if(fn==='signup_customer'&&nm.length<2){e.textContent='اكتب اسمك';e.classList.add('show');return}
 btn.disabled=true;btn.textContent='لحظة...';
 try{
  const body=fn==='signup_customer'?{p_phone:ph,p_password:pw,p_name:nm}:{p_phone:ph,p_password:pw};
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',
   headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
   body:JSON.stringify(body)});
  const d=await r.json().catch(()=>null);
  if(!r.ok||!d||!d.ok){
   const m={wrong_credentials:'الرقم أو كلمة السر مش صح',phone_taken:'الرقم ده مسجل قبل كده — جرّب تسجل دخولك',invalid_phone:'اكتب رقم موبايل صحيح',weak_password:'كلمة السر لازم تكون 6 حروف أو أرقام على الأقل'}[d&&d.error];
   throw (m||'حصلت مشكلة — جرّب تاني');
  }
  try{const oldPh=localStorage.getItem('alexshop_phone');if(oldPh&&oldPh!==d.phone){localStorage.removeItem('alexshop_orders');localStorage.removeItem('alexshop_last_order')}}catch(_){}
  saveSession(d.token,d.phone,d.name||nm);
  authMode='login';render();
 }catch(x){
  btn.disabled=false;btn.textContent=fn==='signup_customer'?'إنشاء الحساب':'دخول';
  e.textContent=(typeof x==='string'&&x)?x:'حصلت مشكلة — جرّب تاني';e.classList.add('show');
 }
}

 try{['alexshop_token','alexshop_name','alexshop_phone','alexshop_last_order','alexshop_orders'].forEach(k=>localStorage.removeItem(k))}catch(e){}
 authMode='login';render();
}
async function checkSession(){
 const t=getToken();if(!t)return;
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/get_session',{method:'POST',
   headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
   body:JSON.stringify({p_token:t})});
  const d=await r.json().catch(()=>null);
  if(!d||!d.ok){try{['alexshop_token','alexshop_name','alexshop_phone','alexshop_last_order','alexshop_orders'].forEach(k=>localStorage.removeItem(k))}catch(e){}render();return}
  try{localStorage.setItem('alexshop_phone',d.phone||'');if(d.name)localStorage.setItem('alexshop_name',d.name)}catch(e){}
 }catch(e){}
}

function useMyLocation(){

 const msg=document.getElementById('locMsg');
 if(!navigator.geolocation){msg.textContent='متصفحك مش بيدعم تحديد الموقع — طلبك هيكمل عادي من غيره';msg.className='locmsg warn';return}

  const b=document.getElementById('locBtn'),m=document.getElementById('locMsg');
  if(!b||!m)return; // الصفحة اتقفلت أو اتنقلنا منها — مفيش حاجة تتعمل
  b.textContent=geoLat!=null?'📍 حدّث مكاني':'📍 استخدم مكاني';
  m.textContent=text;m.className='locmsg '+(ok?'ok':'warn');};
 const failFinal=()=>done(false,geoLat!=null
  ?'مقدرناش نحدّث مكانك دلوقتي — هنستخدم آخر مكان اتحدد ✓ ولو عايز تغيّره جرّب تاني'
  :'مقدرناش نحدد مكانك — جرّب تقف جنب شباك أو تطلع بره ودوس الزرار تاني. طلبك هيكمل عادي من غيره 📦');
 const failPerm=()=>done(false,'الموقع متقفول للمتصفح 🔒 عشان تفتحه في كروم أندرويد: دوس علامة القفل جمب لينك الموقع فوق ← «الأذونات» ← «الموقع» ← «سماح» وارجع دوس الزرار تاني. (آيفون: الإعدادات ← Safari ← الموقع ← «أثناء الاستخدام»). طلبك هيكمل عادي من غيره 📦');
 const tryNet=()=>navigator.geolocation.getCurrentPosition( // محاولة تانية أسرع من الشبكة
   pos2=>{geoLat=+pos2.coords.latitude.toFixed(6);geoLng=+pos2.coords.longitude.toFixed(6);
    done(true,'✓ اتحدد مكانك — هيتبعت مع طلبك للأدمن والكابتن');},
   failFinal,
   {enableHighAccuracy:false,timeout:12000,maximumAge:300000});
 navigator.geolocation.getCurrentPosition(
  pos=>{geoLat=+pos.coords.latitude.toFixed(6);geoLng=+pos.coords.longitude.toFixed(6);
   done(true,'✓ اتحدد مكانك — هيتبعت مع طلبك للأدمن والكابتن');},
  err=>{
   if(err&&err.code===1){failPerm();return}        // رافض الإذن — التعليمات بس اللي هتنفع
   if(err&&(err.code===2||err.code===3)){tryNet();return} // GPS مش متاح أو وقّت — جرّب الشبكة
   failFinal();
  },
  {enableHighAccuracy:true,timeout:12000,maximumAge:0});
}
async function placeOrder(){
 const tk=getToken();
 if(!tk){go('profile');return}
 const n=document.getElementById('fName').value.trim(),
       ph=document.getElementById('fPhone').value.trim(),
       a=document.getElementById('fAddr').value.trim();
 let ok=true;
 const chk=(cond,id)=>{document.getElementById(id).classList.toggle('show',!cond);if(!cond)ok=false};
 chk(n.length>=2,'eName');chk(/^01[0-9]{9}$/.test(ph.replace(/\s/g,'')),'ePhone');chk(a.length>=5,'eAddr');
 if(!ok)return;
 const btn=document.getElementById('orderBtn');btn.disabled=true;btn.textContent='جاري إرسال الطلب...';
 const c=getCart();let sub=0;
 const items=c.map(i=>{const p=findProd(i.id);sub+=p.price*i.qty;return{name:p.name,price:p.price,qty:i.qty,store:p.storeName}});
 const pay=document.querySelector('input[name=pay]:checked').value;
 const d=getDisc();
 const disc=discAmount(sub);
 const total=Math.max(0,sub+fee()-disc);
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/place_order',{method:'POST',
   headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
   body:JSON.stringify({p_token:tk,p_customer_name:n,p_address:a,p_payment:pay,p_items:items,p_subtotal:sub,p_fee:fee(),p_total:total,p_discount_code:d?d.code:null,p_lat:geoLat,p_lng:geoLng})});
  if(!r.ok){const e=await r.json().catch(()=>null);if(e&&e.message&&String(e.message).includes('login_required')){try{localStorage.removeItem('alexshop_token')}catch(_){};alert('جلستك خلصت — سجل دخولك تاني');go('profile');return}throw 0}
  const newId=await r.json();
  setCart([]);setDisc(null);geoLat=null;geoLng=null;
  try{
   localStorage.setItem('alexshop_phone',ph);
   localStorage.setItem('alexshop_name',n);
   localStorage.setItem('alexshop_last_order',String(newId));
   saveOrderRec({id:'AX-'+newId,ts:Date.now(),total:total,items:items.reduce((s,i)=>s+i.qty,0),stores:[...new Set(items.map(i=>i.store))]});
  }catch(e){}
  go('confirm',{id:'AX-'+newId,name:n,total:total,payment:pay,discount:disc});
 }catch(e){
  btn.disabled=false;btn.textContent='أكّد الطلب';
  alert('حصلت مشكلة في إرسال الطلب. اتأكد من الإنترنت وجرب تاني.');
 }
}
loadStores();
checkSession();
</script>
